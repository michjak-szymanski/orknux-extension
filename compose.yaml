# Pinned so container and volume names follow the product, not the directory
# this happens to be checked out into.
name: orknux-extension

services:
  # Node is not installed on the development machine, so the toolchain runs in a
  # container.
  #   docker compose run --rm dev npm install
  #   docker compose run --rm dev npm test
  #   docker compose run --rm dev npm run example
  dev:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-fund --no-audit && npm test"
    volumes:
      - .:/app
      # Keeps the Linux-built dependency tree — esbuild ships a native binary —
      # out of the Windows working copy.
      - node_modules:/app/node_modules
      - plugin_node_modules:/app/plugin/node_modules

volumes:
  node_modules:
  plugin_node_modules:
