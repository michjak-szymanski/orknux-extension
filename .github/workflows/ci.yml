name: CI

# Every push and every pull request is built and tested. Publishing is a
# deliberate act — `npm publish` from a checkout — so nothing here reaches the
# registry.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # What the compose service runs, so a green run here means the same
          # thing it means on a development machine.
          node-version: '22'
          cache: npm

      # `prepare` builds the library on the way through, which is what links the
      # orknux-plugin bin — the example and the tests call it by that name.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The suite says the code behaves; this says the toolchain does. It builds
      # a real plugin with the CLI and lets the CLI decide whether the server
      # would take it — so a change that quietly stops producing a loadable
      # bundle fails here rather than on somebody's installation.
      - name: Build the example
        run: npm run example

  # A tag is what publishes. Nothing else does, and nothing publishes that has
  # not been through the job above.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # A tag on a branch that failed is still a tag; `needs` is what makes this
    # unreachable in that case.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # What `npm publish` reads NODE_AUTH_TOKEN against. Without it the
          # token is set and ignored, and the publish fails as anonymous.
          registry-url: https://registry.npmjs.org

      # The tag is the announcement; package.json is what actually goes out. A
      # v0.2.0 tag over a 0.1.0 package publishes 0.1.0 again and says nothing,
      # so it is refused here rather than discovered in the registry.
      - name: Check the tag against the version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./plugin/package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "$GITHUB_REF_NAME does not match plugin/package.json, which is $declared." >&2
            exit 1
          fi

      # From the root, so the workspace resolves and `prepare` builds the
      # library — the tarball ships dist/, and dist/ is not in the repository.
      - name: Install
        run: npm ci

      # --access public because the scope is private by default and the first
      # publish of a scoped package decides it.
      - name: Publish
        run: npm publish --access public
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
